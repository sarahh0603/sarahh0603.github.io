short_bio: >-
  <p>
    I’m a <strong>high school senior</strong> at <a href="https://www.saschina.org/" target="_blank">Shanghai American School</a>, with interests in astronomy, artificial intelligence, engineering, and linguistics. I use computational tools to investigate  
    stars and planets, develop systems that support learning, and explore how scientific ideas can reach people across languages and backgrounds.
    <img src="assets/images/photos/profile.jpg" alt="Research Interests" 
         style="float: left; width: 350px; margin-right: 10px; border-radius: 8px;">
  </p>

  <p>
    My astronomy research includes using machine learning to distinguish exoplanet 
    candidates from false positives in Kepler and TESS observations. In a separate 
    project, I analyze Kepler light curves to identify stars that may be experiencing a Maunder Minimum–like period of unusually low magnetic activity. This work earned First Place at the 2025 Australian Science & Engineering Fair and took me to <strong>ISEF 2026 as a finalist in Physics & Astronomy</strong>.    
    

  <p>
    I also explore AI for education through an LLM-based coding tutor designed to personalize programming instruction. This research received Second Prize in Computer Science at the 2024 S.-T. Yau High School Science Award, and I am first author of SP-TeachLLM, published in Information in 2025. My computing achievements also include reaching the USACO Platinum Division and earning a Kaggle competition silver medal.
  </p>

  <p>
    At the University of Pennsylvania’s Management & Technology Summer Institute (M&TSI) in 2026, I co-developed Strabeaver, a vision-therapy game prototype for children with strabismus. I also explored technology entrepreneurship through the 2025 Conrad Challenge, serving as COO and CFO of a team developing a drone-swarm approach to forest-fire monitoring and prediction. Our project earned a Gold Medal in Energy & Environment at Conrad Challenge China and the Power Pitch Award (Second Place) at the global competition. 
     
    To share my research with younger readers, I wrote <a href="https://a.co/d/08kVdcwX/" target="_blank">The Planet Hunter’s Helper: How a Computer Learned to Find New Worlds</a>, published on Amazon in English, Spanish, and Chinese. Drawing on my exoplanet research, the book introduces children to astronomy and machine learning through storytelling. Writing and translating it brought together my interests in science, languages, and making complex ideas approachable.
    Beyond my own projects, I serve as President of the Conrad China Alumni Leadership Council, connecting younger teams with mentors. At school, I founded the Astronomy Club and serve as Vice President of the Competitive Computing Club, teaching astronomy and mentoring younger programmers. My outreach also includes astronomy education at Lenghu and English-language reading sessions for local elementary school students  </p>

  <p>
    <i class="fa-solid fa-rectangle-ad" style="color: #d60000;"></i>
    I welcome opportunities to connect with others interested in <span style="color: #d60000;">astronomy, AI, student innovation, and science education</span>. 
    If you are interested in collaborating, 
    please feel free to reach out via email or WeChat.
  </p>



